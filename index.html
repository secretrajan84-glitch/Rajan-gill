    <!--
      Puter.js = the "no API key" layer. It uses the User-Pays model: the
      signed-in user's own Puter account covers AI usage.

      The SDK is bundled with the app (src/lib/puterClient.js imports
      @heyputer/puter.js), so the page boots with zero third-party requests.
      Only api.puter.com is contacted, and only when you press Generate. If the
      bundle ever fails to start, the client falls back to loading
      https://js.puter.com/v2/ automatically.
    -->
